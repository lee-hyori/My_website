<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>나의 마이링크</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5ff;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        a {
            display: block;
            background: #5479e8;
            color: white;
            padding: 15px;
            margin: 15px auto;
            max-width: 300px;
            border-radius: 12px;
            text-decoration: none;
        }

        a:hover {
            background: #3456b8;
        }

        footer {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }

        footer a {
            display: inline;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #3456b8;
            text-decoration: underline;
            overflow-wrap: anywhere;
        }

        footer a:hover {
            background: transparent;
        }
    </style>
</head>

<body>

    <h1>나의 마이링크</h1>

    <p>안녕하세요! 저의 마이링크입니다.</p>

    </a>

            <a href="https://github.com/lee-hyori/My_website">https://github.com/lee-hyori/My_website</a>
